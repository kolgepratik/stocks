[project]
name = "trading-agents"
version = "0.1.0"
description = "Multi-Agent Options Advisory & Execution Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.40.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "python-telegram-bot>=21.0",
    "alpaca-py>=0.26.0",
    "robin-stocks>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
scan = "scripts.run_weekly_scan:main"
bot = "scripts.start_bot:main"
web = "scripts.start_web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
